name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sift_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sift_os_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sift_os_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sift_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check apps/api
      - run: ruff check apps/api
      - run: mypy apps/api/app
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: alembic -c apps/api/alembic.ini check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/web
      - run: npm run lint --workspace apps/web
      - run: npm run test --workspace apps/web -- --run
      - run: npm run build --workspace apps/web

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t sift-os-api:test .
      - run: docker build -f Dockerfile.web -t sift-os-web:test .
